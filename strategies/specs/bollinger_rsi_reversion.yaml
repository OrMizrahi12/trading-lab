# Bollinger + RSI(2) reversion. Filled from strategies/specs/TEMPLATE.yaml.
# Paper trading / backtesting only, never real orders. Nothing here is financial advice.
# Times are exchange local time (America/New_York) unless stated otherwise.

name: bollinger_rsi_reversion
version: 1
description: >
  Buy when the close is below the lower Bollinger band (20-bar average minus 2 standard
  deviations) and the 2-bar RSI is under 10. The bet is that a price stretched this far below
  its recent average, after almost nothing but selling, snaps back to the average.

market:
  symbol: SPY             # Same code runs on QQQ: pass QQQ bars to the engine.
  instrument: etf
  direction: long

timeframe:
  bar_size: 5min
  data_source: data/cache

session:
  timezone: America/New_York
  start: "09:30"
  end: "16:00"
  skip_first_minutes: 15  # Signal bars start at 09:45 or later. ASSUMPTION: same as spy_vwap_reclaim.
  last_entry_time: "15:30"  # Measured as 30 minutes before the real NYSE close (13:30 on a half day). ASSUMPTION.
  no_entry_window:        # Optional midday filter, off by default (params no_entry_from / no_entry_until).
    from: null
    until: null           # Window is [from, until) on the FILL time (the open after the signal bar closes), so 11:30 to 14:00 blocks signal bars starting 11:25 to 13:50. Exits and stops still work inside it.

indicators:
  - name: bb
    type: bollinger
    period: 20
    k: 2.0                # Population standard deviation (divides by n), as TA-Lib does.
  - name: rsi2
    type: rsi
    period: 2             # Wilder smoothing, as in indicators.rsi.
  - name: atr14
    type: atr
    period: 14            # ASSUMPTION: 14 is the standard ATR period.

entry:
  side: long
  conditions:
    - "signal bar start time >= 09:45 and < last_entry_time"
    - "not inside the no-entry window (when one is set)"
  trigger: "close < bb.lower and rsi2 < 10"
  fill: next_open
  max_trades_per_day: null  # ASSUMPTION: no daily cap; the engine holds one position at a time.
  max_open_positions: 1

stop:
  type: atr
  fixed_pct: null
  atr:
    period: 14
    multiple: 2.0         # ASSUMPTION (not in your idea): stop = entry - 2 * ATR.
  swing:
    lookback_bars: null
    buffer: null
  combine: null
  trailing:
    enabled: false
    distance_atr: null
  time_stop:
    enabled: false
    max_bars: null

take_profit:
  type: none              # No target (Entry.target = infinity).
  r_multiple: null
  fixed_pct: null
  atr_multiple: null

exit:
  flatten_time: "15:55"   # Measured as 5 minutes before the real NYSE close (12:55 on a half day). Sell at the open of the 15:55 bar if still open.
  exit_on_signal:
    - "middle_band: close >= bb.middle on a closed bar -> sell at the next open"
  priority: stop_first

sizing:
  method: risk_percent
  risk_pct: 1.0           # Lose 1% of the account if the stop is hit (project default).
  shares: null
  dollars: null
  starting_equity: 100000
  max_position_pct: 100
  allow_fractional: false

filters:
  min_atr: null
  max_atr: null
  min_volume: null
  skip_dates: []
  trend_filter: null

costs:
  commission_per_share: 0.01  # Engine CostModel defaults: 1c commission per side, 1c quoted spread (half per fill), 1c slippage on market fills.
  slippage_per_share: 0.01

notes: >
  Assumptions I added beyond your idea: Bollinger k = 2 (the usual), ATR period 14 and a 2 ATR stop,
  "exit at the middle band" read as a signal exit (a closed bar at or above the middle band, sold
  at the next open as a market order) rather than a limit order, strictly-below / strictly-under
  comparisons, no daily trade cap, no entries in the last 30 minutes, the 09:45 first signal,
  history continuous across days (the bands and RSI may reach into yesterday's last bars).
  Indicators run over the bars the engine shows (the last 200).
