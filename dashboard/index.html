<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Engine Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e3e6ec; --up:#127a3d; --down:#b42318; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2a313d; --up:#4cc38a; --down:#f97066; --accent:#7a9bff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .l { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th.left, td.left { text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .scroll { overflow-x:auto; }
  .up { color:var(--up); } .down { color:var(--down); }
  .empty { color:var(--muted); padding:8px 0; }
  svg { width:100%; height:auto; display:block; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>Paper engine dashboard</h1>
  <div class="sub">Paper trading only, read-only view of the trade journal. <span id="updated"></span></div>

  <div class="card"><h2>Everything running (files only)</h2><div class="scroll" id="status"></div></div>
  <div class="card"><div class="stats" id="stats"></div><div class="note" id="statsnote"></div></div>
  <div class="card"><h2>Account equity</h2><div id="chart"></div></div>
  <div class="card"><h2>Open positions</h2><div class="scroll" id="positions"></div></div>
  <div class="card"><h2>Trades (net of commission, newest first)</h2><div class="scroll" id="trades"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const money = (x, d = 2) => x == null ? "–" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "";

function el(tag, text, className) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (className) e.className = className;
  return e;
}

function table(target, cols, rows, emptyText) {
  target.replaceChildren();
  if (!rows.length) { target.append(el("div", emptyText, "empty")); return; }
  const t = el("table"), head = el("tr");
  cols.forEach(c => head.append(el("th", c.h, c.left ? "left" : "")));
  t.append(head);
  rows.forEach(r => {
    const tr = el("tr");
    cols.forEach(c => { const v = c.f(r); tr.append(el("td", v.text ?? v, [c.left ? "left" : "", v.cls || ""].join(" ").trim())); });
    t.append(tr);
  });
  target.append(t);
}

function stat(label, value, className) {
  const d = el("div", null, "stat");
  d.append(el("div", value, "v " + (className || "")), el("div", label, "l"));
  return d;
}

function chart(points) {
  const box = $("chart");
  box.replaceChildren();
  if (points.length < 2) { box.append(el("div", points.length ? "Only one day of snapshots so far: " + money(points[0].close) : "No account snapshots yet.", "empty")); return; }
  const W = 900, H = 260, L = 70, R = 12, T = 12, B = 28;
  const ys = points.map(p => p.close), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
  const x = i => L + i * (W - L - R) / (points.length - 1), y = v => T + (hi - v) * (H - T - B) / span;
  const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const add = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text) n.textContent = text; s.append(n); return n; };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n);
  [0, .5, 1].forEach(f => { const v = lo + span * f, yy = y(v);
    add("line", {x1:L, x2:W-R, y1:yy, y2:yy, stroke:css("--line")});
    add("text", {x:L-6, y:yy+4, "text-anchor":"end", "font-size":11, fill:css("--muted")}, money(v, 0)); });
  add("text", {x:L, y:H-8, "font-size":11, fill:css("--muted")}, points[0].day);
  add("text", {x:W-R, y:H-8, "text-anchor":"end", "font-size":11, fill:css("--muted")}, points.at(-1).day);
  add("polyline", {points: points.map((p, i) => x(i) + "," + y(p.close)).join(" "), fill:"none", stroke:css("--accent"), "stroke-width":2});
  points.forEach((p, i) => { const c = add("circle", {cx:x(i), cy:y(p.close), r:3, fill:css("--accent")}); const t = document.createElementNS(NS, "title"); t.textContent = p.day + ": " + money(p.close); c.append(t); });
  box.append(s);
}

async function refresh() {
  let d;
  try { d = await (await fetch("/api/data")).json(); } catch (e) { $("updated").textContent = "Could not reach the server."; return; }
  if (d.error) { $("updated").textContent = d.error; return; }
  const s = d.stats;
  $("stats").replaceChildren(
    stat("Trades", s.trades),
    stat("Win rate", s.win_rate == null ? "–" : s.win_rate + "%"),
    stat("Net P&L", money(s.net_pnl), cls(s.net_pnl)),
    stat("Commissions paid", money(s.commissions)));
  $("statsnote").textContent = (d.available ? "" : "No journal file yet. ") +
    (s.pending_commission ? s.pending_commission + " trade(s) still waiting for IB's commission report, so their net P&L may change." : "");
  chart(d.equity);
  table($("positions"), [
    {h:"Symbol", f:r => r.symbol, left:true}, {h:"Side", f:r => r.side}, {h:"Shares", f:r => r.shares},
    {h:"Avg entry", f:r => money(r.avg_entry_price)}, {h:"Opened (NY)", f:r => r.opened},
    {h:"Entry ref", f:r => r.entry_ref, left:true}], d.positions, "No open positions.");
  table($("trades"), [
    {h:"Closed (NY)", f:r => r.closed, left:true}, {h:"Symbol", f:r => r.symbol}, {h:"Shares", f:r => r.shares},
    {h:"Buy", f:r => money(r.buy_price)}, {h:"Sell", f:r => money(r.sell_price)},
    {h:"Gross", f:r => ({text:money(r.gross_pnl), cls:cls(r.gross_pnl)})},
    {h:"Commission", f:r => money(r.commission) + (r.commission_pending ? " *" : "")},
    {h:"Net P&L", f:r => ({text:money(r.net_pnl), cls:cls(r.net_pnl)})},
    {h:"Entry ref", f:r => r.entry_ref, left:true}], d.trades, "No closed trades yet.");
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString() + " (refreshes every 30 s). * commission not yet reported.";
}
async function refreshStatus() {
  let d;
  try { d = await (await fetch("/api/status")).json(); } catch (e) { return; }
  if (d.error) return;
  const rows = d.lab.engines.map(e => ({name: "lab " + e.name + " (client 6)",
    state: e.halted ? "HALTED: " + e.halted : (e.position ? "holds a position" : "flat, running or stopped"),
    bar: e.last_bar ? e.last_bar.bar_start + " (seen " + e.last_bar.delay_min + " min after close)" : "no bar yet"}));
  d.desk.forEach(p => rows.push({name: "desk " + p.name,
    state: !p.file ? "no file" : (p.halted ? "HALTED: " + p.halted : (p.open_trade ? "open trade" : "flat")),
    bar: (p.last_bar ? p.last_bar + " (" + p.last_bar_age_min + " min ago)" : "no bar yet") +
      (p.last_entry && p.last_entry.action ? ", last: " + p.last_entry.action : "")}));
  table($("status"), [{h:"Component", f:r => r.name, left:true}, {h:"State", f:r => r.state, left:true}, {h:"Newest bar", f:r => r.bar, left:true}],
    rows, "Nothing found.");
  const note = el("div", (d.lab.stop_file ? "STOP FILE PRESENT: buys refused. " : "") + "Risk refusals today: " + d.lab.risk_refusals_today + ".", "note");
  $("status").append(note);
}
refresh();
refreshStatus();
setInterval(refreshStatus, 30000);
setInterval(refresh, 30000);
</script>
</body>
</html>
